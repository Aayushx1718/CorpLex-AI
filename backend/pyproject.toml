[project]
name = "corplex-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "langchain-core>=1,<2",
  "faiss-cpu>=1.12,<2",
  "scikit-learn>=1.7,<2",
  "langgraph>=1,<2",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "reportlab>=4,<5",
]
ml = [
    "pandas>=2.2,<4",
    "scikit-learn>=1.7,<2",
    "shap>=0.49,<1",
    "xgboost>=3,<4 ; sys_platform != 'linux'",
    "xgboost-cpu>=3,<4 ; sys_platform == 'linux'",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
