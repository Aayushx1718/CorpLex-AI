name: Verify CorpLex
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: corplex
          POSTGRES_PASSWORD: corplex_ci_only
          POSTGRES_DB: corplex
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U corplex -d corplex"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://corplex:corplex_ci_only@localhost:5432/corplex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --project backend --frozen --group ml
      - run: backend/.venv/bin/pytest backend/tests -q
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: docker compose -p corplex-ci -f compose.app.yaml up --build -d --wait --wait-timeout 180
      - run: curl --fail http://127.0.0.1:8080/api/health
      - name: Exercise backup and isolated recovery with a source document
        env:
          CORPLEX_BACKUP_DIR: ${{ runner.temp }}/corplex-backups
        run: |
          backend/.venv/bin/python scripts/generate_samples.py
          curl --fail -F contract_type=vendor -F title=Recovery-check -F file=@samples/generated/vendor.docx http://127.0.0.1:8080/api/contracts > /dev/null
          mkdir -p "$CORPLEX_BACKUP_DIR"
          docker compose -p corplex-ci -f compose.app.yaml -f compose.backup.yaml run --rm recovery backup
          backup_name=$(basename "$(find "$CORPLEX_BACKUP_DIR" -maxdepth 1 -name '*.dump' -print -quit)")
          docker compose -p corplex-ci -f compose.app.yaml -f compose.backup.yaml run --rm recovery verify "$backup_name"
      - if: always()
        run: docker compose -p corplex-ci -f compose.app.yaml logs --tail 50
      - if: always()
        run: docker compose -p corplex-ci -f compose.app.yaml down -v
