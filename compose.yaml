services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-corplex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corplex_local}
      POSTGRES_DB: ${POSTGRES_DB:-corplex}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
